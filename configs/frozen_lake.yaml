env:
  name: "FrozenLake-v1"
  is_slippery: true
  map_size: 8

feature:
  mode: "onehot"

qlearning:
  alpha: 0.1
  gamma: 0.95
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 0.9999

dqn:
  gamma: 0.99
  learning_rate: 0.0003
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay_steps: 100000
  batch_size: 64
  buffer_size: 50000
  learn_start: 2000
  target_update_freq: 500
  tau: 0.005
  grad_clip: 10.0
  hidden_dim: 128
  mid_dim: 64

hcra_dqn:
  gamma: 0.99
  learning_rate: 0.0003
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay_steps: 100000
  batch_size: 64
  buffer_size: 50000
  learn_start: 2000
  target_update_freq: 500
  tau: 0.005
  grad_clip: 10.0
  hidden_dim: 128
  mid_dim: 64
  sequence_length: 16
  attention_heads: 2
  attention_dim: 32
  num_segments: 4
  num_refinements: 2
  fusion_lambda: 0.0
  contract_reg_coeff: 0.01

training:
  max_episodes: 200
  eval_interval: 20
  eval_episodes: 30
  save_interval: 100
  log_interval: 10
